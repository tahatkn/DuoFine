<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Password Change | DuoFine</title>
<meta name="theme-color" content="#0B1020">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css?v=a8e88dca">
</head>
<body class="body-status-page">
    <div class="status-container">
        <a class="status-brand" href="/"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"><path d="M30 85 C 80 85, 80 15, 30 15"/><path d="M70 15 C 20 15, 20 85, 70 85"/></svg>DuoFine</a>
        <h1>Change password</h1>
        <p>Choose a new password for your Common Ground account.</p>
        <div class="status-form">
            <div class="form-group">
                <label for="passwordOne">New password</label>
                <input type="password" id="passwordOne" autocomplete="new-password" aria-describedby="passwordHint" minlength="8" spellcheck="false">
                <p class="form-hint" id="passwordHint">At least 8 characters, including at least one special character (for example ! ? # or @).</p>
            </div>
            <div class="form-group">
                <label for="passwordTwo">Confirm new password</label>
                <input type="password" id="passwordTwo" autocomplete="new-password" minlength="8" spellcheck="false">
            </div>
            <button id="passwordBtn" class="cta-button" type="button">Change password</button>
        </div>
        <p id="resultText" role="alert" aria-live="assertive"></p>
        <p class="status-help">Need help? Contact info@duofine.com</p>
    </div>
    <script src="passwordChangeScript.js"></script>
</body>
</html>
